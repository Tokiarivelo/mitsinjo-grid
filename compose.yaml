# Mitsinjo Grid web app. `make docker-up` → http://localhost:3000 (offline mock copilot without .env).
# A root `.env` (optional) passes your Meta keys; PORT is forced to 3000 inside the container.
services:
  web:
    build: .
    image: mitsinjo-grid
    ports:
      - '${HOST_PORT:-3000}:3000'
    env_file:
      - path: .env
        required: false
    environment:
      PORT: '3000'
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/overview').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
